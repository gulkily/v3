<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenMemes — tour</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f4f1ea; --ink:#1d1b18; --muted:#6b655c; --card:#fff; --line:#ddd6c8; --accent:#2f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151412; --ink:#eee9df; --muted:#9a9385; --card:#1f1d1a; --line:#34302a; --accent:#7fc4a0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width:1400px; margin:0 auto; padding:40px 24px 0; }
  h1 { font-size:30px; margin:0 0 6px; letter-spacing:-.01em; }
  .controls { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
              max-width:1400px; margin:0 auto; padding:12px 24px; padding-top:max(12px, env(safe-area-inset-top));
              background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
  .seg button { border:0; background:none; color:var(--ink); padding:7px 14px; font:inherit; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }

  main { max-width:1400px; margin:0 auto; padding:12px 24px 64px;
         display:grid; gap:28px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  body.phone main { grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }

  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;
           box-shadow:0 1px 0 rgba(0,0,0,.03), 0 8px 24px -16px rgba(0,0,0,.25); display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--line); }
  .bar .url { margin-left:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; font-family:ui-monospace, Menlo, monospace; }
  .bar a { color:var(--accent); text-decoration:none; font-weight:600; }

  .viewport { position:relative; width:100%; aspect-ratio:820/1100; overflow:hidden; background:var(--bg); }
  body.phone .viewport { aspect-ratio:390/844; }
  .viewport iframe { position:absolute; top:0; left:0; border:0; width:820px; height:1100px; transform-origin:0 0; background:#fff; }
  body.phone .viewport iframe { width:390px; height:844px; }
  body:not(.interactive) .viewport iframe { pointer-events:none; }
  body:not(.interactive) .viewport { cursor:zoom-in; }
  .shield { position:absolute; inset:0; touch-action:pan-x pan-y; }
  body.interactive .shield { display:none; }

  figcaption { padding:14px 16px 16px; }
  figcaption h2 { font-size:16px; margin:0 0 4px; }
  figcaption p { margin:0; color:var(--muted); font-size:14px; }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:0 24px 40px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ZenMemes</h1>
</header>
<div class="controls">
  <div class="seg" role="group" aria-label="Viewport">
    <button data-view="desktop" aria-pressed="true">Desktop</button>
    <button data-view="phone" aria-pressed="false">Phone</button>
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button data-mode="look" aria-pressed="true">Look</button>
    <button data-mode="interactive" aria-pressed="false">Interact</button>
  </div>
</div>


<main id="grid"></main>

<footer><a href="/">Open the board</a> · <a href="https://github.com/gulkily/v3">v3 on GitHub</a></footer>

<script>
const BASE = "";
const features = [
  ["/", "The board", "Front page of threads: news, feature requests, rap tracks, essays, all on one high-signal board."],
  ["/threads/thread-20261109042004-31f74e95f0036ae011d44d0304c500af", "A thread", "Start here: a full thread with replies, tags and signed posts."],
  ["/threads/thread-20261111034513-db948d63", "Built with agents", "How to use ZenMemes with an AI agent. Friends' agents have shipped v3 PRs straight from a thread."],
  ["/agent/", "Agent page", "Copyable prompts for pointing ChatGPT, Claude, Codex and others at the site."],
  ["/recent/", "Recent", "Everything new across the board, in order."],
  ["/gallery/", "Gallery", "Images posted to the board, as a wall."],
  ["/calendar", "Calendar", "Community events, gated by member approval."],
  ["/tags/", "Tags", "Hashtags as navigation: #meta, #rapclub, #specialoffer…"],
  ["/users/", "Users", "The continuous social graph: who vouched for whom, made visible."],
  ["/activity/", "Activity", "Likes, approvals, posts: the record layer, in the open."],
  ["/compose/thread", "Compose", "Write a thread. Signing happens in the browser with your own key; works offline too."],
  ["/account/key/", "Your key", "Browser-held identity: no password, just an OpenPGP key you control."],
  ["/backup/", "Backup", "Download the whole content repo and read-model database. Portable by design."],
  ["/api/", "Plain-text API", "Machine-readable entry points for agents and scripts."],
  ["/llms.txt", "llms.txt", "The agent's front door, in plain text."],
  ["/about/", "About", "What ZenMemes is, and why it's built this way."],
];

const grid = document.getElementById("grid");
features.forEach(([path, title, blurb]) => {
  const url = BASE + path;
  const fig = document.createElement("figure");
  fig.innerHTML = `
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="url">${location.host}${path}</span><a href="${url}">Open</a></div>
    <div class="viewport"><iframe data-src="${url}" title="${title}"></iframe><div class="shield"></div></div>
    <figcaption><h2>${title}</h2><p>${blurb}</p></figcaption>`;
  fig.querySelector(".viewport").addEventListener("click", () => {
    if (!document.body.classList.contains("interactive")) location.href = url;
  });
  grid.appendChild(fig);
});

function fit() {
  const phone = document.body.classList.contains("phone");
  const w = phone ? 390 : 820;
  document.querySelectorAll(".viewport").forEach(v => {
    v.querySelector("iframe").style.transform = `scale(${v.clientWidth / w})`;
  });
}
new ResizeObserver(fit).observe(grid);
window.addEventListener("resize", fit);

function wire(attr, apply) {
  document.querySelectorAll(`[data-${attr}]`).forEach(b => b.addEventListener("click", () => {
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    apply(b.dataset[attr]); fit();
  }));
}
wire("view", v => document.body.classList.toggle("phone", v === "phone"));
wire("mode", m => document.body.classList.toggle("interactive", m === "interactive"));
fit();

// Load every frame up front, in page order, a few at a time.
const queue = [...document.querySelectorAll("iframe[data-src]")];
function next() {
  const f = queue.shift();
  if (!f) return;
  let done = false;
  const go = () => { if (!done) { done = true; next(); } };
  f.addEventListener("load", go, { once: true });
  setTimeout(go, 8000);
  f.src = f.dataset.src;
}
for (let i = 0; i < 3; i++) next();
</script>
</body>
</html>

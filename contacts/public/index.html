<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <link rel="stylesheet" href="/contacts.css">
  <script src="/contacts.js" defer></script>
</head>
<body>
  <header class="shell"><h1>Contacts</h1></header>
  <main class="shell">
    <p id="status" role="status" hidden></p>
    <section aria-labelledby="import-title" class="card" id="intake">
      <h2 id="import-title">Import LinkedIn connections</h2>
      <form id="import-form">
        <label id="drop-zone" for="file">Choose or drop Connections.csv</label>
        <input id="file" name="file" type="file" accept=".csv,.zip" required>
        <button type="submit">Preview import</button>
      </form>
    </section>
    <section aria-labelledby="preview-title" class="card" id="preview" hidden>
      <h2 id="preview-title" tabindex="-1">Review import</h2>
      <dl id="counts"></dl>
      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">Row</th><th scope="col">Contact</th><th scope="col">Details</th><th scope="col">Result</th></tr></thead>
          <tbody id="preview-rows"></tbody>
        </table>
      </div>
      <div class="actions">
        <button id="more-preview" type="button" hidden>Show more rows</button>
        <button id="cancel-preview" class="secondary" type="button">Cancel</button>
      </div>
    </section>
  </main>
</body>
</html>
